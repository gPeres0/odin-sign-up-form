<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h3>The Input Element:</h3>
    <form action="https://httpbin.org/post" method="post">
        <!-- Text Input -->
        <div>
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" placeholder="Bob..." name="first_name">
        </div>
        <fieldset>
            <legend>Log on info</legend>

        <!-- Email Input -->
            <label for="email_address">*Email Address:</label>
            <input type="email" id="email_address" placeholder="user@email.com" name="email_address" required>
        <!-- Password Input -->
            <label for="user_password">*Password:</label>
            <input type="password" id="user_password" name="password" required>
        </fieldset>
        <!-- Number Input -->
        <div>
            <label for="value">Value:</label>
            <input type="number" id="value" name="value">
        </div>
        <!-- Date Input -->
        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>
        <!-- Text Area -->
        <div>
            <textarea name="text_area" id="text_area" rows="10" cols="60">Some initial text in tha box</textarea>
        </div>

        <button>FCKN CLICK ME</button>
        <button type="submit">SUBMIT THIS SHIT</button>
        <button type="reset">RESET THIS SHIT</button>
        <button type="button">GENERIC ASS BUTTON</button>
    </form>

    <h3>Selection Elements:</h3>
    <form action="https://httpbin.org/post" method="post">
        <div>    
            <select name="Car">
                <option value="mercedes">Mercedes</option>
                <option value="tesla">Tesla</option>
                <option value="volvo" selected>Volvo</option>
                <option value="bmw">BMW</option>
                <option value="mini">Mini</option>
                <option value="ford">Ford</option>
            </select>
        </div>
        
        <div>
            <select name="fashion">
              <optgroup label="Clothing">
                <option value="t_shirt">T-Shirts</option>
                <option value="sweater">Sweaters</option>
                <option value="coats">Coats</option>
              </optgroup>
              <optgroup label="Foot Wear">
                <option value="sneakers">Sneakers</option>
                <option value="boots">Boots</option>
                <option value="sandals">Sandals</option>
              </optgroup>
            </select>
        </div>

        <div>
            <h4>Ticket Type</h4>
            <fieldset>
                <legend>How grown up are you?</legend>

                <div>
                    <input type="radio" id="child" name="ticket_type" value="child">
                    <label for="child">Child</label>
                </div>
                <div>
                    <input type="radio" id="adult" name="ticket_type" value="adult" checked>
                    <label for="adult">Adult</label>
                </div>
                <div>
                    <input type="radio" id="senior" name="ticket_type" value="senior">
                    <label for="senior">Senior</label>
                </div>
            </fieldset>
        </div>

        <div>
            <h4>Pizza Toppings</h4>
            <div>
              <input type="checkbox" id="sausage" name="topping" value="sausage">
              <label for="sausage">Sausage</label>
            </div>
            <div>
              <input type="checkbox" id="onions" name="topping" value="onions">
              <label for="onions">Onions</label>
            </div>
            <div>
              <input type="checkbox" id="pepperoni" name="topping" value="pepperoni" checked>
              <label for="pepperoni">Pepperoni</label>
            </div>
            <div>
              <input type="checkbox" id="mushrooms" name="topping" value="mushrooms">
              <label for="mushrooms">Mushrooms</label>
            </div>
        </div>
    </form>

</body>
</html>
